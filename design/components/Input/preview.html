<!-- @dsCard group="Formulários" height=300 -->
<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Input</title></head>
<body>
<div class="lm-col" style="max-width:420px">
  <div class="lm-field"><label for="nome">Nome do negócio</label><input class="lm-input" id="nome" value="Studio Força"></div>
  <div class="lm-field"><label for="slug">Endereço da página</label>
    <div class="lm-affix"><span>linkmural.com/</span><input class="lm-input" id="slug" value="studioforca"></div>
    <span class="lm-help lm-help--ok"><svg class="lm-ico" style="width: 14px; height: 14px" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>Disponível</span></div>
  <div class="lm-field"><label for="wpp">WhatsApp</label><input class="lm-input" id="wpp" type="tel" value="(00) 0000" aria-invalid="true" aria-describedby="wpp-e">
    <span class="lm-help lm-help--error" id="wpp-e"><svg class="lm-ico" style="width: 14px; height: 14px" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4 2.5 20h19zM12 10v4M12 17h.01"/></svg>Número incompleto. Use DDD + número.</span></div>
</div>
</body>
</html>
