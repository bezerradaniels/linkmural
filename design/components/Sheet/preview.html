<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Sheet</title></head>
<body>
<div class="lm-row" style="justify-content:center">
  <div class="lm-sheet-stage" style="width:360px; height:430px">
    <div class="lm-sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">
      <div class="lm-sheet__grab" aria-hidden="true"></div>
      <div class="lm-sheet__head"><h3 class="lm-sheet__title" id="sh-t">Adicionar link</h3><button class="lm-btn lm-btn--ghost lm-btn--icon lm-btn--sm" type="button" aria-label="Fechar"><svg class="lm-ico" style="width: 16px; height: 16px" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
      <div class="lm-field"><label for="sh1">Título</label><input class="lm-input" id="sh1" value="Grade de aulas"></div>
      <div class="lm-field"><label for="sh2">Endereço</label><input class="lm-input" id="sh2" type="url" placeholder="https://"></div>
      <button class="lm-btn lm-btn--primary lm-btn--lg" type="button" style="width:100%">Adicionar</button>
    </div>
  </div>
</div>
</body>
</html>
