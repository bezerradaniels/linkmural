<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Backgrounds</title></head>
<body>
<div class="lm-row" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:12px; align-items:stretch">
  <div style="display:flex;flex-direction:column;gap:6px"><div class="lm-bg lm-bg--paper"></div><span class="lm-label">Paper liso · padrão</span></div>
  <div style="display:flex;flex-direction:column;gap:6px"><div class="lm-bg lm-bg--dots"></div><span class="lm-label">Grade de pontos · landing, onboarding</span></div>
  <div style="display:flex;flex-direction:column;gap:6px"><div class="lm-bg lm-bg--lime"></div><span class="lm-label">Lime com pontos · chamadas</span></div>
  <div style="display:flex;flex-direction:column;gap:6px"><div class="lm-bg lm-bg--ink"></div><span class="lm-label">Ink · rodapé, seções de impacto</span></div>
  <div style="display:flex;flex-direction:column;gap:6px"><div class="lm-bg lm-bg--mural"><svg viewBox="0 0 160 120" width="100%" height="120" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect x="10" y="12" width="60" height="44" rx="12" style="fill:var(--surface);stroke:var(--line)"/><rect x="78" y="12" width="72" height="28" rx="12" style="fill:var(--lime-soft)"/><rect x="78" y="48" width="72" height="60" rx="12" style="fill:var(--surface);stroke:var(--line)"/><rect x="10" y="64" width="60" height="44" rx="12" style="fill:var(--ink)"/><circle cx="146" cy="14" r="7" style="fill:var(--lime);stroke:var(--paper);stroke-width:3"/></svg></div><span class="lm-label">Mural · hero e redes</span></div>
</div>
</body>
</html>
