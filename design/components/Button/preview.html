<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Button</title></head>
<body>
<div class="lm-col">
  <div class="lm-row" style="padding:0">
    <button class="lm-btn lm-btn--primary" type="button">Criar minha página</button>
    <button class="lm-btn lm-btn--secondary" type="button"><svg class="lm-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Adicionar link</button>
    <button class="lm-btn lm-btn--outline" type="button">Ver planos</button>
    <button class="lm-btn lm-btn--ghost" type="button">Cancelar</button>
    <button class="lm-btn lm-btn--danger" type="button">Excluir link</button>
  </div>
  <div class="lm-row" style="padding:0">
    <button class="lm-btn lm-btn--primary lm-btn--lg" type="button">Publicar</button>
    <button class="lm-btn lm-btn--primary" type="button">Publicar</button>
    <button class="lm-btn lm-btn--primary lm-btn--sm" type="button">Publicar</button>
    <button class="lm-btn lm-btn--secondary lm-btn--icon" type="button" aria-label="Compartilhar"><svg class="lm-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 5a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0 -5 0M3.5 12a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0 -5 0M15.5 19a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0 -5 0M8.2 10.8l7.6-4.6M8.2 13.2l7.6 4.6"/></svg></button>
    <button class="lm-btn lm-btn--outline lm-btn--icon lm-btn--sm" type="button" aria-label="Editar"><svg class="lm-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4"/></svg></button>
  </div>
  <div class="lm-row" style="padding:0">
    <button class="lm-btn lm-btn--primary" type="button" aria-busy="true"><span class="lm-spinner" aria-hidden="true"></span>Publicando…</button>
    <button class="lm-btn lm-btn--primary" type="button" disabled>Limite atingido</button>
    <span class="lm-label">Passe o mouse para ver o hover: o botão sobe 1px; ao clicar, encolhe 2%.</span>
  </div>
</div>
</body>
</html>
