<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Alert</title></head>
<body>
<div class="lm-col" style="max-width:520px">
  <div class="lm-alert lm-alert--info" role="status"><svg class="lm-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0M12 11v5M12 8h.01"/></svg><div class="lm-alert__body"><span class="lm-alert__title">Falta 1 link para o limite do Grátis</span>No Pro seus links são ilimitados. <a class="lm-link" href="#">Ver planos</a></div></div>
  <div class="lm-alert lm-alert--success" role="status"><svg class="lm-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg><div class="lm-alert__body"><span class="lm-alert__title">Página publicada</span>Seu link já pode ir para a bio.</div></div>
  <div class="lm-alert lm-alert--warning" role="status"><svg class="lm-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4 2.5 20h19zM12 10v4M12 17h.01"/></svg><div class="lm-alert__body"><span class="lm-alert__title">Pagamento em atraso</span>Atualize o cartão até 26 nov para manter o plano Negócios.</div></div>
  <div class="lm-alert lm-alert--error" role="alert"><svg class="lm-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4 2.5 20h19zM12 10v4M12 17h.01"/></svg><div class="lm-alert__body"><span class="lm-alert__title">Não deu para salvar</span>Verifique sua conexão e tente de novo.</div></div>
</div>
</body>
</html>
